<div class="flex min-h-screen flex-col bg-orange-50">
  <!-- Toldo de supermercado -->
  <div class="h-12 w-full shadow-sm"
       style="background: repeating-linear-gradient(90deg, #f87171 0 48px, #fff7ed 48px 96px);">
  </div>
  <div class="h-4 w-full"
       style="background: radial-gradient(circle at 24px 0, #f87171 16px, transparent 17px) 0 0 / 96px 16px repeat-x,
                          radial-gradient(circle at 24px 0, #fed7aa 16px, transparent 17px) 48px 0 / 96px 16px repeat-x;">
  </div>

  <main class="flex flex-1 items-center justify-center px-4 py-12">
    <div class="w-full max-w-2xl rounded-3xl border border-orange-200 bg-white p-8 text-center shadow-sm sm:p-12">
      <!-- Icono -->
      <div class="mx-auto mb-5 flex h-16 w-16 items-center justify-center rounded-full bg-red-100">
        <svg xmlns="http://www.w3.org/2000/svg"
             fill="none"
             viewBox="0 0 24 24"
             stroke-width="1.8"
             stroke="currentColor"
             class="h-8 w-8 text-red-400">
          <path stroke-linecap="round" stroke-linejoin="round"
            d="M2.25 3h1.386c.51 0
            .955.343 1.087.835l.383
            1.437M7.5 14.25a3 3 0 0 0-3
            3h15.75m-12.75-3h11.218c1.121-2.3
            2.1-4.684 2.924-7.138a60.114 60.114
            0 0 0-16.536-1.84M7.5 14.25 5.106 5.272M6
            20.25a.75.75 0 1 1-1.5 0 .75.75 0 0 1 1.5
            0Zm12.75 0a.75.75 0 1 1-1.5 0 .75.75 0 0 1 1.5 0Z" />
        </svg>
      </div>

      <!-- Título -->
      <h1 class="text-3xl font-bold tracking-tight text-stone-800 sm:text-4xl">
        Buscar <span class="text-red-400">Productos</span>
      </h1>
      <p class="mt-2 text-base text-stone-500">
        Compara precios entre supermercados en un solo lugar.
      </p>

      <!-- Buscador -->
      <form class="mt-8">
        <div class="flex items-center gap-2 rounded-xl border-2 border-orange-200 bg-orange-50/50 p-1.5
                    focus-within:border-red-300">
          <svg xmlns="http://www.w3.org/2000/svg"
               fill="none"
               viewBox="0 0 24 24"
               stroke-width="2"
               stroke="currentColor"
               class="ml-3 h-5 w-5 shrink-0 text-orange-300">
            <path stroke-linecap="round" stroke-linejoin="round" d="m21 21-5.197-5.197m0 0A7.5 7.5 0 1 0
            5.196 5.196a7.5 7.5 0 0 0 10.607 10.607Z" />
          </svg>

          <input
              [(ngModel)]="product"
            id="q"
            name="q"
            type="search"
            autofocus
            autocomplete="off"
            placeholder="Ej. leche, arroz, café..."
            class="w-full min-w-0 bg-transparent py-3 text-base text-stone-800 placeholder-stone-400 outline-none"
          />
          <button
            (click)="searchProduct()"
            type="submit"
            class="shrink-0 rounded-lg bg-red-400 px-6 py-3 text-sm font-semibold text-white
                   hover:bg-red-500 focus:outline-none focus-visible:ring-2 focus-visible:ring-red-300">
            Buscar
          </button>
        </div>
      </form>
      @if(empty_entry){
      <div class="font-bold tracking-tight text-red-400 sm:text-300 sm:mt-4">
        Error: Ingrese una busqueda
      </div>
      }
    </div>
  </main>
</div>
