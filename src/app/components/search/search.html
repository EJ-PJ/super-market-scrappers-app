<div class="relative flex min-h-screen items-center justify-center overflow-hidden bg-gray-950 px-4 py-12">
  <!-- Fondo decorativo -->
  <div class="pointer-events-none absolute -top-40 -left-40 h-96 w-96 rounded-full bg-indigo-600/30 blur-3xl">
  </div>
  <div class="pointer-events-none absolute -bottom-40 -right-40 h-96 w-96 rounded-full bg-emerald-500/20 blur-3xl">
  </div>

  <div class="relative w-full max-w-2xl text-center">
    <!-- Icono -->
    <div class="mx-auto mb-6 flex h-16 w-16 items-center justify-center rounded-2xl bg-gradient-to-br
                from-indigo-500 to-emerald-500 shadow-lg shadow-indigo-500/30">
      <svg xmlns="http://www.w3.org/2000/svg"
        fill="none"
        viewBox="0 0 24 24"
        stroke-width="1.8"
        stroke="currentColor"
        class="h-8 w-8 text-white">
        <path stroke-linecap="round" stroke-linejoin="round"
          d="M2.25 3h1.386c.51 0
          .955.343 1.087.835l.383
          1.437M7.5 14.25a3 3 0 0 0-3
          3h15.75m-12.75-3h11.218c1.121-2.3
          2.1-4.684 2.924-7.138a60.114 60.114
          0 0 0-16.536-1.84M7.5 14.25 5.106 5.272M6
          20.25a.75.75 0 1 1-1.5 0 .75.75 0 0 1 1.5
          0Zm12.75 0a.75.75 0 1 1-1.5 0 .75.75 0 0 1 1.5 0Z" />
      </svg>
    </div>

    <!-- Título -->
    <h1 class="text-4xl font-bold tracking-tight text-white sm:text-5xl">
      Buscar
      <span class="bg-gradient-to-r from-indigo-400 to-emerald-400 bg-clip-text text-transparent">
        Productos
      </span>
    </h1>

    <p class="mt-3 text-base text-gray-400 sm:text-lg">
      Compara precios entre supermercados en un solo lugar.
    </p>

    <!-- Buscador -->
    <form class="mt-8">
      <div class="flex items-center gap-2 rounded-2xl border border-white/10 bg-white/5 p-2
                  shadow-2xl backdrop-blur transition focus-within:border-indigo-500/60 focus-within:ring-4
                  focus-within:ring-indigo-500/20">
        <svg xmlns="http://www.w3.org/2000/svg"
             fill="none"
             viewBox="0 0 24 24"
             stroke-width="2"
             stroke="currentColor"
          class="ml-3 h-5 w-5 shrink-0 text-gray-400">
          <path stroke-linecap="round" stroke-linejoin="round" d="m21 21-5.197-5.197m0 0A7.5 7.5 0 1 0
          5.196 5.196a7.5 7.5 0 0 0 10.607 10.607Z" />
        </svg>

        <input
          id="q"
          name="q"
          type="search"
          autofocus
          autocomplete="off"
          placeholder="Ej. leche, arroz, café..."
          class="w-full min-w-0 bg-transparent py-3 text-base text-white placeholder-gray-500 outline-none"
        />
        <button
          type="submit"
          class="shrink-0 rounded-xl bg-indigo-600 px-5 py-3 text-sm font-semibold text-white
                 shadow-lg shadow-indigo-600/30 transition hover:bg-indigo-500 active:scale-95
                 focus:outline-none focus-visible:ring-2 focus-visible:ring-indigo-400">
          Buscar
        </button>
      </div>
    </form>

    <!-- Sugerencias -->
    <div class="mt-6 flex flex-wrap items-center justify-center gap-2 text-sm">
      <span class="text-gray-500">
        Populares:
      </span>
      <button type="button"
              class="rounded-full border border-white/10 bg-white/5 px-3 py-1
              text-gray-300 transition hover:border-indigo-500/50 hover:text-white">
          Leche
      </button>
      <button type="button"
        class="rounded-full border border-white/10 bg-white/5 px-3 py-1
        text-gray-300 transition hover:border-indigo-500/50 hover:text-white">Huevos</button>
      <button type="button" class="rounded-full border border-white/10 bg-white/5 px-3 py-1 text-gray-300 transition hover:border-indigo-500/50 hover:text-white">Arroz</button>
      <button type="button" class="rounded-full border border-white/10 bg-white/5 px-3 py-1 text-gray-300 transition hover:border-indigo-500/50 hover:text-white">Café</button>
    </div>
  </div>
</div>
