<div class="flex flex-col justify-center items-center min-h-screen gap-4 px-4">
  <h1 class="text-3xl font-semibold text-gray-800">Buscar Productos</h1>
  <form
    (ngSubmit)="searchProduct()"
    class="relative w-full max-w-xl mx-auto bg-white rounded-full">
    <input
       [(ngModel)]="product"
       (ngModelChange)="empty_entry = false"
       placeholder="Ej. leche, arroz, coca cola"
       class="rounded-full w-full h-16
       bg-transparent py-2 pl-8 pr-32 outline-none
       border-2 border-gray-100 shadow-md hover:outline-none
       focus:ring-teal-200 focus:border-teal-200"
       type="text"
       name="query"
       id="query"
       autofocus>
    <button
      type="submit"
      class="absolute inline-flex items-center h-10 px-4
      py-2 text-sm text-white transition duration-150
      ease-in-out rounded-full outline-none right-3 top-3
      bg-teal-600 sm:px-6 sm:text-base sm:font-medium
      hover:bg-teal-700 focus:outline-none focus:ring-2
      focus:ring-offset-2 focus:ring-teal-500">
      <svg
        class="-ml-0.5 sm:-ml-1 mr-2 w-4 h-4 sm:h-5 sm:w-5"
        xmlns="http://www.w3.org/2000/svg"
        fill="none"
        viewBox="0 0 24 24"
        stroke="currentColor">
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="2"
          d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z">
        </path>
      </svg>
      Buscar
    </button>
  </form>
  @if (empty_entry) {
    <p class="text-sm text-red-600">Escribe un producto para buscar</p>
  }
  <!-- Optional: prices of the stores that deliver to this zone -->
  <div class="w-full max-w-xl mx-auto">
    <app-location-picker />
  </div>
</div>
