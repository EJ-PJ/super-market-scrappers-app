<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
  <title>Supermarket Scrapper</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      font-family: system-ui, sans-serif;
      background: #f9fafb;
      color: #1f2937;
    }
    .spinner {
      width: 40px;
      height: 40px;
      border: 4px solid #ccfbf1;
      border-top-color: #0d9488;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .error { color: #b91c1c; max-width: 480px; text-align: center; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <div id="spinner" class="spinner"></div>
  <p id="message">Iniciando...</p>
  <p id="error" class="error hidden"></p>

  <script>
    // main.js loads this page with ?error=... when the backend can't start
    const error = new URLSearchParams(location.search).get('error');
    if (error) {
      document.getElementById('spinner').classList.add('hidden');
      document.getElementById('message').textContent = 'No se pudo iniciar la aplicación';
      const element = document.getElementById('error');
      element.textContent = error;
      element.classList.remove('hidden');
    }
  </script>
</body>
</html>
