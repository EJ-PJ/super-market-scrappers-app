# Supermarket API stack for the VPS. Run from backend/: docker compose up -d --build
# Needs the certificate first (see README / .env.example), issued by the inventario certbot
name: supermarket-scrapper

services:
  backend:
    build: .
    image: supermarket-scrapper-backend:latest
    restart: unless-stopped
    env_file: .env
    # not published: only the proxy reaches it on the internal network
    expose:
      - "8000"
    mem_limit: 1g

  proxy:
    image: nginx:1.28-alpine
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8001:8001"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # certificates written by the certbot of /opt/inventario (read only)
      - ${CERTS_DIR:-/opt/inventario/certbot/conf}:/etc/letsencrypt:ro
    # reload every 12 h so a certificate renewed by certbot is picked up
    command: ["/bin/sh", "-c", "while :; do sleep 12h; nginx -s reload; done & exec nginx -g 'daemon off;'"]
