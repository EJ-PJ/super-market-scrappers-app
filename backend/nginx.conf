# HTTPS entry point of the supermarket API: https://super.elbuenclavo.tech:8001/api/v1/...
# Ports 80/443 belong to the inventario stack (/opt/inventario). Its certbot issues and
# renews this certificate too (webroot through its port 80), we only read the files.
server {
    listen 8001 ssl;
    http2 on;
    server_name super.elbuenclavo.tech;

    ssl_certificate     /etc/letsencrypt/live/super.elbuenclavo.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/super.elbuenclavo.tech/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;

    # http://...:8001 (plain HTTP on the TLS port) -> https
    error_page 497 =301 https://$host:8001$request_uri;

    # Docker DNS, resolved on every request: a rebuilt backend can get a new IP
    resolver 127.0.0.11 valid=10s;
    set $backend http://backend:8000;

    location /api/ {
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # one search calls 5 store websites
        proxy_read_timeout 90s;
    }

    location / {
        return 404;
    }
}
